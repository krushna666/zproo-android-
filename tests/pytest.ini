[pytest]
testpaths = e2e security
addopts = -ra --strict-markers --reruns 0 -p no:cacheprovider
markers =
    smoke: fast checks of the main journeys
    auth: authentication and deep login
    bus: bus module
    flight: flight module
    hotel: hotel module
    checkout: shared checkout
    security: API security (requests only)
    sop: UI style SOP compliance
    a11y: accessibility (axe-core, keyboard)
    mobile: mobile-only checks
    desktop: desktop-only checks

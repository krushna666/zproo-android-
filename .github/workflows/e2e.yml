name: E2E

# Selenium end-to-end (desktop + mobile) and API security suites (Prompt 04). Make "E2E / Suites"
# a required status check in branch protection so a red run blocks the merge.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suites:
    name: Suites
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zproo
          POSTGRES_PASSWORD: zproo
          POSTGRES_DB: zproo_go
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zproo -d zproo_go"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # Unit/API tests use zproo_go; the end-to-end stack creates and migrates zproo_e2e.
      DATABASE_URL: postgresql://zproo:zproo@localhost:5432/zproo_go?schema=public
      DIRECT_DATABASE_URL: postgresql://zproo:zproo@localhost:5432/zproo_go?schema=public
      REDIS_URL: redis://localhost:6379
      E2E_DATABASE_URL: postgresql://zproo:zproo@localhost:5432/zproo_e2e
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Chrome and a matching chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install
        run: |
          npm ci
          python -m pip install -r tests/requirements.txt

      - name: Unit and API tests
        run: |
          npx prisma migrate deploy
          npm run db:seed
          npm run test

      - name: Start the end-to-end stack
        run: scripts/e2e-stack.sh

      - name: Selenium (desktop, mobile) and API security
        env:
          PYTHON: python
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: make e2e-suites PYTHON=python WORKERS=4

      - name: Stop the stack
        if: always()
        run: scripts/e2e-stack.sh stop

      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            artifacts/
            tests/e2e/artifacts/
            tests/e2e/.run/*.log
            tests/security/production-api-*.log
          if-no-files-found: ignore
          retention-days: 14
